<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact – F&S</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&family=Lora:wght@400;700&display=swap" rel="stylesheet">

<!-- Main CSS -->
<link rel="stylesheet" href="styles.css">

<style>
/* ===== Page Content ===== */
.content {
  text-align: center;
  padding: 100px 20px 60px 20px; /* top padding to avoid navbar overlap */
}

.content h1 {
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  margin-bottom: 10px;
}

.content p {
  font-size: 18px;
  opacity: 0.8;
}

.contact-box {
  margin-top: 40px;
  font-size: 18px;
  line-height: 2;
}

a {
  color: black;
  text-decoration: none;
}

a:hover {
  color: #d4af37;
}

.back {
  display: inline-block;
  margin-top: 50px;
  letter-spacing: 2px;
}

@media (max-width: 768px) {
  h1.title { font-size: 52px; }
}
</style>
</head>

<body>

<!-- Navbar Include -->
<div id="navbar-placeholder"></div>
<script>
fetch('navbar.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('navbar-placeholder').innerHTML = data;
  });
</script>

<!-- Contact Content -->
<section class="content">
  <h1>Contact</h1>
  <p>We’d love to hear from you.</p>

  <div class="contact-box">
    ✉️ <a href="mailto:hello@fsbrand.com">hello@fsbrand.com</a><br>
    📍 Oslo, Norway<br>
    📸 <a href="#">Instagram</a>
  </div>

  <a class="back" href="index.html">← Back to Home</a>
</section>

</body>
</html>
