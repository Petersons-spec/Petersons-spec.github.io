<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>{{ page.title }}</h1>

<div class="grid">
  {% raw %}{% for image in page.images %}{% endraw %}
    <img src="{{ image }}">
  {% raw %}{% endfor %}{% endraw %}
</div>

</body>
</html>
