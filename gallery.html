<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F&S Gallery</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Lora:wght@400;700&display=swap" rel="stylesheet">

<!-- Main CSS -->
<link rel="stylesheet" href="styles.css">

<style>
/* ===== Page Header ===== */
.header {
  text-align: center;
  padding: 140px 20px 20px; /* top padding increased for navbar space */
}

.header h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 64px;
  margin: 0;
}

.header p {
  letter-spacing: 3px;
  font-size: 13px;
  opacity: 0.7;
  text-transform: uppercase;
}

/* ===== Gallery Grid ===== */
.gallery {
  max-width: 1200px;
  margin: auto;
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 28px;
}

.gallery img {
  width: 100%;
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.4s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.gallery img:hover {
  transform: translateY(-10px) scale(1.02);
  box-shadow: 0 20px 45px rgba(0,0,0,0.12);
}

/* ===== Lightbox ===== */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.96);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#lightbox img {
  max-width: 88%;
  max-height: 88%;
  border-radius: 14px;
}

#lightbox::after {
  content: "Click anywhere to close";
  position: absolute;
  bottom: 30px;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.5;
}

/* ===== Footer ===== */
footer {
  text-align: center;
  padding: 40px 20px;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.6;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  h1.title { font-size: 52px; }
}
@media (max-width: 600px) {
  .header h1 { font-size: 46px; }
}

button {
  margin: 8px;
  padding: 10px 18px;
  border: none;
  border-radius: 20px;
  background: #111;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #444;
}
  
</style>
</head>

<body>

<!-- Navbar Include -->
<div id="navbar-placeholder"></div>
<script>
fetch('navbar.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('navbar-placeholder').innerHTML = data;
  });
</script>

<!-- Page Header -->
<section class="header">
  <h1>Gallery</h1>
  <p>Moments • Details • Atmosphere</p>
</section>

<!-- Gallery Controls -->
<div style="text-align:center; margin-top:20px;">
  <button onclick="loadGallery('moments')">Moments</button>
  <button onclick="loadGallery('details')">Details</button>
  <button onclick="loadGallery('atmosphere')">Atmosphere</button>
</div>

<!-- Gallery -->
<section class="gallery" id="gallery"></section>

<!-- Lightbox -->
<div id="lightbox">
  <img src="">
</div>

<footer>
  © Yamatai 2026
</footer>

<script>
const lightbox = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");

const gallery = document.getElementById("gallery");

// ✅ ONLY ONE galleries object
const galleries = {
  moments: ["1.jpg", "2.jpg", "3.jpg"],
  details: ["4.jpg", "5.jpg"],
  atmosphere: ["6.jpg"]
};

// LOAD FUNCTION
function loadGallery(type) {
  gallery.innerHTML = "";

  galleries[type].forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.loading = "lazy";

    img.onclick = () => {
      lightbox.style.display = "flex";
      lightboxImg.src = src;
    };

    gallery.appendChild(img);
  });
}

// DEFAULT LOAD
loadGallery("moments");

// LIGHTBOX CLOSE
lightbox.onclick = () => lightbox.style.display = "none";
</script>

</body>
