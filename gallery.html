<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F&S Gallery</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Lora:wght@400;700&display=swap" rel="stylesheet">

<!-- Main CSS -->
<link rel="stylesheet" href="styles.css">

<style>
/* ===== Page Header ===== */
.header {
  text-align: center;
  padding: 140px 20px 20px; /* top padding increased for navbar space */
}

.header h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 64px;
  margin: 0;
}

.header p {
  letter-spacing: 3px;
  font-size: 13px;
  opacity: 0.7;
  text-transform: uppercase;
}

/* ===== Gallery Grid ===== */
.gallery {
  max-width: 1200px;
  margin: auto;
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 28px;
}

.gallery img {
  width: 100%;
  border-radius: 18px;
  cursor: pointer;
  transition: all 0.4s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.gallery img:hover {
  transform: translateY(-10px) scale(1.02);
  box-shadow: 0 20px 45px rgba(0,0,0,0.12);
}

/* ===== Lightbox ===== */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.96);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#lightbox img {
  max-width: 88%;
  max-height: 88%;
  border-radius: 14px;
}

#lightbox::after {
  content: "Click anywhere to close";
  position: absolute;
  bottom: 30px;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.5;
}

/* ===== Footer ===== */
footer {
  text-align: center;
  padding: 40px 20px;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.6;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  h1.title { font-size: 52px; }
}
@media (max-width: 600px) {
  .header h1 { font-size: 46px; }
}
</style>
</head>

<body>

<!-- Navbar Include -->
<div id="navbar-placeholder"></div>
<script>
fetch('navbar.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('navbar-placeholder').innerHTML = data;
  });
</script>

<!-- Page Header -->
<section class="header">
  <h1>Gallery</h1>
  <p>Moments • Details • Atmosphere</p>
</section>

<!-- Gallery -->
<section class="gallery">
  <img src="1.jpg" alt="">
  <img src="2.jpg" alt="">
  <img src="3.jpg" alt="">
  <img src="4.jpg" alt="">
  <img src="5.jpg" alt="">
  <img src="6.jpg" alt="">
</section>

<!-- Lightbox -->
<div id="lightbox">
  <img src="">
</div>

<footer>
  © Yamatai 2026
</footer>

<script>
const lightbox = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");

document.querySelectorAll(".gallery img").forEach(img => {
  img.onclick = () => {
    lightbox.style.display = "flex";
    lightboxImg.src = img.src;
  };
});

lightbox.onclick = () => lightbox.style.display = "none";
</script>

</body>
</html>
