<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F&S Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Lora:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<style>

/* ===== Page Header ===== */
.header {
  text-align: center;
  padding: 140px 20px 20px;
}

.header h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 64px;
  margin: 0;
}

.header p {
  letter-spacing: 3px;
  font-size: 13px;
  opacity: 0.7;
  text-transform: uppercase;
}

/* ===== GALLERY FIXED ===== */
.gallery {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;

  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;

  align-items: start; /* FIX */
}

.gallery img {
  width: 100%;
  height: auto;
  display: block; /* FIX */
  border-radius: 18px;
  cursor: pointer;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  object-fit: cover;

  opacity: 1 !important;
  visibility: visible !important;
}

.gallery img:hover {
  transform: translateY(-10px) scale(1.02);
  box-shadow: 0 20px 45px rgba(0,0,0,0.12);
}

/* ===== Lightbox ===== */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.96);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#lightbox img {
  max-width: 88%;
  max-height: 88%;
  border-radius: 14px;
}

#lightbox::after {
  content: "Click anywhere to close";
  position: absolute;
  bottom: 30px;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.5;
}

/* ===== Footer ===== */
footer {
  text-align: center;
  padding: 40px 20px;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.6;
}

button {
  margin: 8px;
  padding: 10px 18px;
  border: none;
  border-radius: 20px;
  background: #111;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #444;
}

</style>
</head>

<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>
<script>
fetch('navbar.html')
  .then(r => r.text())
  .then(d => document.getElementById('navbar-placeholder').innerHTML = d);
</script>

<!-- Header -->
<section class="header">
  <h1>Gallery</h1>
  <p>Moments • Details • Atmosphere</p>
</section>

<!-- Gallery -->
<section class="gallery" id="gallery"></section>

<!-- Lightbox -->
<div id="lightbox">
  <img src="">
</div>

<footer>
  © Yamatai 2026
</footer>

<script>
const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");

const images = [
  "images/white1.jpg",
  "images/white2.jpg",
  "images/white3.jpg",
  "images/white4.jpg",
  "images/white5.jpg",
  "images/white6.jpg"
];

function loadGallery() {
  gallery.innerHTML = "";

  images.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.loading = "lazy";

    img.addEventListener("click", () => {
      lightbox.style.display = "flex";
      lightboxImg.src = src;
    });

    gallery.appendChild(img);
  });
}

loadGallery();

lightbox.addEventListener("click", () => {
  lightbox.style.display = "none";
});
</script>

</body>
</html>
