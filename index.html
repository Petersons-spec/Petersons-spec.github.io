<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F&S Homepage</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;600&family=Lora:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Lora',serif;
background:linear-gradient(135deg,#f7e6e6,#f4d1d1);
}

/* ===== NAVBAR ===== */

.banner{
position:sticky;
top:0;
z-index:999;
height:80px;
background:linear-gradient(145deg,rgba(255,255,255,0.95),rgba(245,240,235,0.85));
backdrop-filter:blur(14px);
box-shadow:0 8px 30px rgba(0,0,0,0.18);
border-bottom:1px solid rgba(212,175,55,0.25);
display:flex;
justify-content:center;
align-items:center;
}

.title-link{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-decoration:none;
}

h1.title{
font-family:'Great Vibes',cursive;
font-size:60px;
margin:0;
color:#111;
text-shadow:0 5px 15px rgba(0,0,0,0.25);
transition:0.3s;
}

h1.title:hover{
transform:scale(1.07);
color:#d4af37;
text-shadow:0 6px 20px rgba(212,175,55,0.5);
}

.nav-left,.nav-right{
position:absolute;
bottom:12px;
display:flex;
gap:28px;
}

.nav-left{left:40px;}
.nav-right{right:40px;}

.nav-left a,.nav-right a{
font-size:18px;
letter-spacing:2px;
text-decoration:none;
color:#222;
padding:8px 14px;
border-radius:10px;
transition:0.35s;
}

.nav-left a:hover,.nav-right a:hover{
color:#d4af37;
}

/* ===== HERO ===== */

.hero-wrapper{
max-width:1200px;
margin:10px auto 0 auto;
height:calc(100vh - 80px);
padding:0 20px;
}

.hero-main{
position:relative;
width:100%;
height:100%;
}

.hero-main img{
width:100%;
height:100%;
border-radius:14px;
box-shadow:0 14px 30px rgba(0,0,0,0.16);
object-fit:cover;
transition:transform 0.6s ease;
}

/* overlay */

.hero-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;
color:white;
text-align:center;
padding:60px 40px;
box-sizing:border-box;
}

.hero-overlay::before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
to bottom,
rgba(0,0,0,0.55),
rgba(0,0,0,0.2),
rgba(0,0,0,0.65)
);
border-radius:14px;
}

.hero-overlay>*{
position:relative;
z-index:2;
}

/* top text */

.hero-top{
font-size:18px;
letter-spacing:4px;
text-transform:uppercase;
opacity:0.9;
}

/* center headline */

.hero-center{
font-family:'Playfair Display',serif;
font-size:56px;
max-width:700px;
line-height:1.2;
text-shadow:0 6px 20px rgba(0,0,0,0.6);
}

/* button */

.hero-btn{
text-decoration:none;
padding:14px 34px;
background:#d4af37;
color:white;
font-size:16px;
letter-spacing:2px;
border-radius:8px;
transition:0.35s;
box-shadow:0 6px 18px rgba(0,0,0,0.3);
}

.hero-btn:hover{
background:#b9962f;
transform:translateY(-3px);
box-shadow:0 10px 24px rgba(0,0,0,0.35);
}

/* ===== BELOW ===== */

.shop-call{
text-align:center;
margin:60px 0 20px;
font-family:'Playfair Display',serif;
font-size:40px;
opacity:0;
transform:translateY(20px);
transition:1s;
}

.gallery{
display:flex;
justify-content:center;
gap:30px;
padding:40px;
flex-wrap:wrap;
}

.gallery img{
width:280px;
border-radius:16px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
opacity:0;
transform:translateY(20px);
transition:1s;
}

footer{
text-align:center;
margin:40px 0;
font-size:14px;
letter-spacing:2px;
opacity:0.6;
}

/* animation */

.hero-main img,.shop-call,.gallery img{
opacity:0;
transform:translateY(20px);
transition:1s;
}

.hero-visible{
opacity:1!important;
transform:translateY(0)!important;
}

</style>
</head>

<body>

<section class="banner">

<a href="index.html" class="title-link">
<h1 class="title">F&S</h1>
</a>

<div class="nav-left">
<a href="gallery.html">Collection</a>
<a href="about.html">About Us</a>
</div>

<div class="nav-right">
<a href="account.html">Account</a>
<a href="contact.html">Contact</a>
</div>

</section>

<!-- HERO -->

<section class="hero-wrapper">

<div class="hero-main">

<img src="red.jpg" alt="Hero Image">

<div class="hero-overlay">

<div class="hero-top">
Timeless Style • Modern Elegance
</div>

<div class="hero-center">
Discover Your Signature Look
</div>

<div class="hero-bottom">
<a href="gallery.html" class="hero-btn">Shop Collection</a>
</div>

</div>

</div>

</section>

<section class="shop-call">
Shop Now & Browse Collection
</section>

<div class="gallery">
<img src="1.jpg">
<img src="2.jpg">
<img src="3.jpg">
</div>

<footer>
© Yamatai 2026
</footer>

<script>

const faders=document.querySelectorAll('.hero-main img,.shop-call,.gallery img');

const appearOptions={threshold:0.2};

const appearOnScroll=new IntersectionObserver(function(entries,observer){
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add('hero-visible');
observer.unobserve(entry.target);
}
});
},appearOptions);

faders.forEach(fader=>appearOnScroll.observe(fader));

</script>

</body>
</html>
