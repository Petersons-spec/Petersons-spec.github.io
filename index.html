  <!-- Page-specific CSS -->
  <style>
    body {
      margin: 0;
      font-family: 'Lora', serif;
      background: linear-gradient(135deg, #f7e6e6, #f4d1d1);
    }

    /* ===== HERO SECTION ===== */
    .hero-wrapper {
      display: flex;
      max-width: 1200px;
      margin: 10px auto 0 auto;
      gap: 18px;
      height: calc(100vh - 120px);
      padding: 0 20px;
    }

    .hero-main {
      flex: 2;
    }

    .hero-main img {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.16);
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .hero-main img:hover { transform: scale(1.03); }

    .hero-side {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1.2fr 1fr;
      gap: 12px;
    }

    .hero-side img:nth-child(1) { grid-column: 1 / 3; }

    .hero-side img {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .hero-side img:hover { transform: scale(1.03); }

    /* ===== BELOW FOLD ===== */
    .shop-call {
      text-align: center;
      margin: 60px 0 20px;
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease-out;
    }

    .gallery {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px;
      flex-wrap: wrap;
    }

    .gallery img {
      width: 280px;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease-out;
    }

    footer {
      text-align: center;
      margin: 40px 0;
      font-size: 14px;
      letter-spacing: 2px;
      opacity: 0.6;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .hero-wrapper { flex-direction: column; height: auto; gap: 10px; }
      .hero-main { height: 42vh; }
      .hero-side { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; height: 16vh; }
      .hero-side img:nth-child(1) { grid-column: auto; }
    }

    /* ===== FADE-IN ANIMATION ===== */
    .hero-main img, .hero-side img, .shop-call, .gallery img {
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s ease-out;
    }

    .hero-visible { opacity: 1 !important; transform: translateY(0) !important; }
  </style>
</head>

  <!-- CALL TO ACTION -->

    Shop Now & Browse Collection
  </section>

  <!-- GALLERY -->
  <div class="gallery">
    <img src="1.jpg">
    <img src="2.jpg">
    <img src="3.jpg">
  </div>

  <!-- FOOTER -->
  <footer>© Yamatai 2026</footer>

  <!-- FADE-IN SCRIPT -->
  <script>
    const faders = document.querySelectorAll('.hero-main img, .hero-side img, .shop-call, .gallery img');
    const appearOptions = { threshold: 0.2 };

    const appearOnScroll = new IntersectionObserver(function(entries, observer) {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('hero-visible');
          observer.unobserve(entry.target);
        }
      });
    }, appearOptions);

    faders.forEach(fader => appearOnScroll.observe(fader));
  </script>

</body>
