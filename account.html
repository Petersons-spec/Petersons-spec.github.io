<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account – F&S</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:wght@400;600&family=Lora:wght@400;700&display=swap" rel="stylesheet">

<!-- Main CSS -->
<link rel="stylesheet" href="styles.css">

<style>
/* ===== Account Page Content ===== */
.account-wrapper {
  max-width: 600px;
  margin: 100px auto 60px auto; /* top margin ensures navbar space */
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  padding: 30px 20px;
  border-radius: 16px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
  text-align: center;
}

.account-wrapper h2 {
  font-family: 'Great Vibes', cursive;
  font-size: 32px;
  margin-bottom: 20px;
}

.account-wrapper p {
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 18px;
}

footer {
  text-align: center;
  margin: 30px 0;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.6;
}

/* ===== Responsive Adjustments ===== */
@media (max-width: 768px) {
  .account-wrapper { margin: 120px auto 40px auto; padding: 24px 16px; }
}
</style>
</head>

<body>

<!-- Navbar Include -->
<div id="navbar-placeholder"></div>
<script>
fetch('navbar.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('navbar-placeholder').innerHTML = data;
  });
</script>

<!-- Account Content -->
<section class="account-wrapper">
  <h2>My Account</h2>
  <p>Welcome back! Here you can manage your orders, update your details, and view your favourites.</p>
  <p><em>Account functionality coming soon...</em></p>
</section>

<footer>© Yamatai 2026</footer>

</body>
</html>
